services:
  api:
    build: .
    image: support-desk-api:local
    # Порт открыт только на локальном интерфейсе, стенд не виден из сети.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Значения берутся из файла .env, который в репозиторий не попадает.
      # Если переменная пуста, учетная запись не создается, сервис все равно стартует.
      SeedAccounts__0__Login: ${SEED_USER_LOGIN:-}
      SeedAccounts__0__DisplayName: ${SEED_USER_DISPLAY_NAME:-}
      SeedAccounts__0__Role: User
      SeedAccounts__0__Password: ${SEED_USER_PASSWORD:-}
      SeedAccounts__1__Login: ${SEED_SPECIALIST_LOGIN:-}
      SeedAccounts__1__DisplayName: ${SEED_SPECIALIST_DISPLAY_NAME:-}
      SeedAccounts__1__Role: Specialist
      SeedAccounts__1__Password: ${SEED_SPECIALIST_PASSWORD:-}
    volumes:
      - app-data:/data
    # Контейнер проверяет себя сам, тем же исполняемым файлом.
    healthcheck:
      test: ["CMD", "dotnet", "SupportDesk.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  app-data:
